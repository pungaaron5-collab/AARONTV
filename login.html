<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sisselogimine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🔐 Admini sisselogimine</h1>
</header>

<main class="admin">

    <input id="email" type="email" placeholder="E-mail">
    <br><br>

    <input id="password" type="password" placeholder="Parool">
    <br><br>

    <button onclick="login()">
        Logi sisse
    </button>

    <p id="message"></p>

</main>


<script type="module">

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import { getAuth, signInWithEmailAndPassword } from 
"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


const firebaseConfig = {
    apiKey: "SIIA_TULEB_SINU_API_KEY",
    authDomain: "SIIA_TULEB_SINU_AUTH_DOMAIN",
    projectId: "SIIA_TULEB_SINU_PROJECT_ID"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


window.login = function(){

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;


    signInWithEmailAndPassword(auth, email, password)

    .then(() => {

        window.location.href = "admin.html";

    })

    .catch(() => {

        document.getElementById("message").innerHTML =
        "Vale e-mail või parool!";

    });

}

</script>


</body>
</html>
